# Alternative zum Hosting auf Vercel: veröffentlicht die Karte auf GitHub Pages.
# Läuft absichtlich nur von Hand (Actions -> Deploy auf GitHub Pages -> Run workflow),
# damit ohne eingerichtete Pages keine roten Haken an den Commits kleben.
# Einmalig nötig: Repository -> Settings -> Pages -> Source: "GitHub Actions".
name: Deploy auf GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
